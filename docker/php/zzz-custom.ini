; ========== 上传文件大小限制 ==========
upload_max_filesize = 500M
post_max_size = 512M

; ========== 内存限制 ==========
memory_limit = 512M

; ========== 执行时间限制（大文件上传需要更长时间）==========
max_execution_time = 600
max_input_time = 600

; ========== 其他优化 ==========
; 临时文件存放目录（确保有足够空间）
; upload_tmp_dir = /tmp

; 最大输入变量数
max_input_vars = 5000

; 默认 socket 超时
default_socket_timeout = 600


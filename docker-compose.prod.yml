# 生产环境 Docker Compose 配置
# 基于 Laravel Sail，添加 Nginx 反向代理和 SSL 支持

services:
    # Laravel 应用服务（复用 Sail 配置）
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        container_name: douyin-admin-app
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        # 生产环境不直接暴露端口，通过 nginx 代理
        expose:
            - '80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
            PHP_CLI_SERVER_WORKERS: 4
            PHP_MEMORY_LIMIT: '512M'
            PHP_POST_MAX_SIZE: '500M'
            PHP_UPLOAD_MAX_FILESIZE: '500M'
        volumes:
            - '.:/var/www/html'
            - './docker/php/zzz-custom.ini:/etc/php/8.5/cli/conf.d/99-zzz-custom.ini'
            - './docker/php/zzz-custom.ini:/etc/php/8.5/fpm/conf.d/99-zzz-custom.ini'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Nginx 反向代理 + SSL
    nginx:
        image: nginx:alpine
        container_name: douyin-admin-nginx
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - '.:/var/www/html'
            - './docker/nginx/conf.d:/etc/nginx/conf.d'
            - './docker/nginx/ssl:/etc/nginx/ssl:ro'
            - './docker/nginx/logs:/var/log/nginx'
        networks:
            - sail
        depends_on:
            - laravel.test

    # MySQL 数据库
    mysql:
        image: 'mysql:8.4'
        container_name: douyin-admin-mysql
        restart: unless-stopped
        # 生产环境不暴露端口，仅通过内部网络访问
        # ports:
        #     - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            retries: 3
            timeout: 5s

    # Redis 缓存
    redis:
        image: 'redis:alpine'
        container_name: douyin-admin-redis
        restart: unless-stopped
        # 生产环境不暴露端口，仅通过内部网络访问
        # ports:
        #     - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local

